<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0b141a;color:#e9edef;height:100vh;overflow:hidden}
#setup{display:flex;justify-content:center;align-items:center;height:100vh;background:linear-gradient(135deg,#075E54,#128C7E)}
.box{background:#111b21;padding:30px;border-radius:15px;text-align:center;width:90%;max-width:400px}
.box h1{margin-bottom:10px;color:#25D366}
.box p{margin-bottom:20px;color:#8696a0}
.box input{width:100%;padding:12px;border-radius:8px;border:1px solid #2a3942;background:#2a3942;color:#fff;margin-bottom:15px;font-size:16px}
.box button{width:100%;padding:12px;background:#25D366;color:#111b21;border:none;border-radius:8px;font-weight:bold;font-size:16px;cursor:pointer}
#chat{display:none;flex-direction:column;height:100vh}
header{background:#202c33;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}
.hl{display:flex;align-items:center;gap:10px}
.av{width:40px;height:40px;border-radius:50%;background:#25D366;color:#111b21;display:flex;align-items:center;justify-content:center;font-weight:bold}
header h2{font-size:16px}
.st{font-size:12px;color:#8696a0}
.st.on{color:#25D366}
header button{background:none;border:none;color:#8696a0;font-size:20px;cursor:pointer;padding:5px 8px}
#panel{background:#111b21;padding:15px;border-bottom:1px solid #2a3942;max-height:70vh;overflow-y:auto;display:none}
#panel h3{margin-bottom:12px;font-size:15px}
.row{display:flex;gap:10px;margin-bottom:12px}
.row button{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.p{background:#25D366;color:#111b21}
.s{background:#2a3942;color:#e9edef}
.cl{width:100%;margin-top:10px;padding:8px;background:#f15c6d;border:none;border-radius:8px;color:#fff;cursor:pointer}
.cb{margin-top:12px}
.cb p{font-size:12px;color:#8696a0;margin:8px 0}
.cb textarea{width:100%;height:60px;padding:8px;border-radius:6px;border:1px solid #2a3942;background:#2a3942;color:#fff;font-size:11px;resize:none;margin-bottom:6px}
.cb button{padding:6px 14px;background:#25D366;border:none;border-radius:6px;color:#111b21;font-weight:bold;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:15px}
.msg{max-width:75%;padding:8px 12px;border-radius:10px;margin-bottom:8px;font-size:14px;word-wrap:break-word}
.msg.sent{background:#005c4b;margin-left:auto}
.msg.recv{background:#202c33;margin-right:auto}
.msg .t{font-size:10px;color:#8696a0;display:block;text-align:right;margin-top:3px}
.sys{text-align:center;font-size:12px;color:#8696a0;background:#202c33;padding:5px 15px;border-radius:15px;margin:10px auto;display:table}
footer{background:#202c33;padding:10px;display:flex;gap:8px}
footer input{flex:1;padding:12px;border-radius:20px;border:none;background:#2a3942;color:#fff;font-size:14px;outline:none}
footer button{width:45px;height:45px;border-radius:50%;background:#25D366;border:none;color:#111b21;font-size:20px;cursor:pointer}
.hide{display:none!important}
</style>
</head>
<body>

<div id="setup">
  <div class="box">
    <h1>💬 P2P Chat</h1>
    <p>Bina Data, Direct Connect</p>
    <input type="text" id="uname" placeholder="Apna naam daalein" maxlength="20">
    <button onclick="startApp()">Start Chatting</button>
  </div>
</div>

<div id="chat">
  <header>
    <div class="hl">
      <div class="av" id="myAv">U</div>
      <div>
        <h2 id="myName">User</h2>
        <span class="st" id="status">● Offline</span>
      </div>
    </div>
    <div>
      <button onclick="togglePanel()" title="Connect">🔗</button>
      <button onclick="clearChat()" title="Clear">🗑️</button>
    </div>
  </header>

  <div id="panel">
    <h3>Ek Baar Connect Karein (Fir Hamesha Ke Liye Save Ho Jayega)</h3>
    <div class="row">
      <button class="p" onclick="createOffer()">📤 Naya Link Banayein</button>
      <button class="s" onclick="showJoin()">📥 Link Se Judein</button>
    </div>
    
    <div id="offerBox" class="cb hide">
      <p>Ye code doosre phone ko bhejein (sirf ek baar):</p>
      <textarea id="offerCode" readonly></textarea>
      <button onclick="copy('offerCode')">Copy</button>
      <p>Phir unka answer code yahan paste karein:</p>
      <textarea id="answerIn" placeholder="Answer code paste karein..."></textarea>
      <button onclick="acceptAnswer()">Connect & Save</button>
    </div>

    <div id="joinBox" class="cb hide">
      <p>Offer code yahan paste karein:</p>
      <textarea id="joinOffer" placeholder="Offer code paste karein..."></textarea>
      <button onclick="joinOffer()">Answer Banayein</button>
      <div id="answerOut" class="hide">
        <p>Ye answer code wapas bhejein:</p>
        <textarea id="myAnswer" readonly></textarea>
        <button onclick="copy('myAnswer')">Copy</button>
      </div>
    </div>
    <button class="cl" onclick="togglePanel()">✕ Band Karein</button>
  </div>

  <div id="msgs"></div>

  <footer>
    <input type="text" id="msgIn" placeholder="Message likhein..." onkeypress="if(event.key==='Enter')send()">
    <button onclick="send()">➤</button>
  </footer>
</div>

<script>
let pc=null, dc=null, myName='';
let isOfferer = false;

// Start App & Load Saved Data
function startApp(){
  const n=document.getElementById('uname').value.trim();
  if(!n){alert('Naam daalein!');return;}
  myName=n;
  localStorage.setItem('p2p_myName', myName); // Naam save kiya
  
  document.getElementById('myName').textContent=n;
  document.getElementById('myAv').textContent=n[0].toUpperCase();
  document.getElementById('setup').style.display='none';
  document.getElementById('chat').style.display='flex';
  
  initPC();

  // Check karein agar pehle se koi saved connection hai
  const savedOffer = localStorage.getItem('p2p_savedOffer');
  const savedAnswer = localStorage.getItem('p2p_savedAnswer');

  if(savedOffer && savedAnswer) {
    sys('🔄 Pichla connection mila... Auto-connect ho raha hai.');
    autoConnect(savedOffer, savedAnswer);
  }
}

function initPC(){
  pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
  pc.onconnectionstatechange=()=>{
    const s=document.getElementById('status');
    if(pc.connectionState==='connected'){
      s.textContent='● Connected';s.classList.add('on');
      sys('✅ Connected!');
      document.getElementById('panel').style.display='none'; // Connect hone par panel band
    }
    else if(pc.connectionState==='connecting'){s.textContent='● Connecting...';}
    else{s.textContent='● Offline';s.classList.remove('on');}
  };
  pc.ondatachannel=e=>{dc=e.channel;setupDC();};
}

function setupDC(){
  dc.onopen=()=>{
    dc.send(JSON.stringify({type:'name',name:myName}));
  };
  dc.onmessage=e=>{
    const d=JSON.parse(e.data);
    if(d.type==='name'){document.getElementById('myName').textContent=myName+' ↔ '+d.name;}
    else if(d.type==='msg'){addMsg(d.text,'recv');}
  };
  dc.onclose=()=>{document.getElementById('status').textContent='● Offline';};
}

// Auto Connect Logic
async function autoConnect(offerStr, answerStr) {
  try {
    const offer = JSON.parse(atob(offerStr));
    await pc.setRemoteDescription(offer);
    const answer = JSON.parse(atob(answerStr));
    await pc.setRemoteDescription(answer);
  } catch(e) {
    console.log("Auto connect failed, manual karein");
  }
}

function waitIce(p){
  return new Promise(r=>{
    if(p.iceGatheringState==='complete')return r();
    const c=()=>{if(p.iceGatheringState==='complete'){p.removeEventListener('icegatheringstatechange',c);r();}};
    p.addEventListener('icegatheringstatechange',c);
    setTimeout(r,3000);
  });
}

async function createOffer(){
  if(!pc)initPC();
  dc=pc.createDataChannel('chat');
  setupDC();
  const o=await pc.createOffer();
  await pc.setLocalDescription(o);
  await waitIce(pc);
  const code = btoa(JSON.stringify(pc.localDescription));
  localStorage.setItem('p2p_savedOffer', code); // Save Offer
  document.getElementById('offerCode').value=code;
  document.getElementById('offerBox').classList.remove('hide');
}

async function acceptAnswer(){
  const c=document.getElementById('answerIn').value.trim();
  if(!c){alert('Answer paste karein');return;}
  try{
    const ans = JSON.parse(atob(c));
    await pc.setRemoteDescription(ans);
    localStorage.setItem('p2p_savedAnswer', c); // Save Answer
    sys('⏳ Connecting...');
    document.getElementById('panel').style.display='none';
  }catch(e){alert('Invalid: '+e.message);}
}

function showJoin(){
  document.getElementById('joinBox').classList.remove('hide');
  document.getElementById('offerBox').classList.add('hide');
}

async function joinOffer(){
  const c=document.getElementById('joinOffer').value.trim();
  if(!c){alert('Offer paste karein');return;}
  if(!pc)initPC();
  try{
    const offer = JSON.parse(atob(c));
    localStorage.setItem('p2p_savedOffer', c); // Save Offer (as joiner)
    
    await pc.setRemoteDescription(offer);
    const a=await pc.createAnswer();
    await pc.setLocalDescription(a);
    await waitIce(pc);
    
    const ansCode = btoa(JSON.stringify(pc.localDescription));
    localStorage.setItem('p2p_savedAnswer', ansCode); // Save Answer
    
    document.getElementById('myAnswer').value=ansCode;
    document.getElementById('answerOut').classList.remove('hide');
  }catch(e){alert('Invalid: '+e.message);}
}

function copy(id){
  const el=document.getElementById(id);
  el.select();
  navigator.clipboard.writeText(el.value);
  alert('✅ Copy ho gaya!');
}

function togglePanel(){
  const p=document.getElementById('panel');
  p.style.display=p.style.display==='block'?'none':'block';
}

function send(){
  const i=document.getElementById('msgIn');
  const t=i.value.trim();
  if(!t)return;
  if(!dc||dc.readyState!=='open'){alert('⚠️ Connection offline hai. Dono phone on hone chahiye.');return;}
  dc.send(JSON.stringify({type:'msg',text:t}));
  addMsg(t,'sent');
  i.value='';
}

function addMsg(t,type){
  const d=document.createElement('div');
  d.className='msg '+type;
  const time=new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  d.innerHTML=t+'<span class="t">'+time+'</span>';
  document.getElementById('msgs').appendChild(d);
  const m=document.getElementById('msgs');
  m.scrollTop=m.scrollHeight;
}

function sys(t){
  const d=document.createElement('div');
  d.className='sys';
  d.textContent=t;
  document.getElementById('msgs').appendChild(d);
}

function clearChat(){
  if(confirm('Chat clear karein? (Connection safe rahega)')){
    document.getElementById('msgs').innerHTML='';
  }
}
</script>
</body>
</html>
